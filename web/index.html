<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bevo's Tacos Checkout</title>
    <meta name="description" content="Checkout for an Austin food truck: walk-up and catering orders, a kitchen board and a sales dashboard." />
    <link rel="icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <header class="nav">
        <a class="brand" href="#/">🌮 Bevo's Tacos</a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links" aria-label="Menu">☰</button>
        <nav id="nav-links" class="nav-links">
            <a href="#/" data-route="home">Home</a>
            <a href="#/order/walkup" data-route="walkup">Walk-Up Order</a>
            <a href="#/order/catering" data-route="catering">Catering Order</a>
            <a href="#/kitchen" data-route="kitchen">Kitchen <span class="badge" id="kitchen-count" hidden></span></a>
            <a href="#/dashboard" data-route="dashboard">Dashboard</a>
            <a href="#/about" data-route="about">How It Works</a>
        </nav>
    </header>

    <main id="app" tabindex="-1"></main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- footer: a kitchen ticket, the last order of the page -->
    <footer class="footer ticket-foot">
        <div class="ticket">
            <p class="ticket-head"><b>Order #2026</b><span>Cooked up by Suhani Tiwari</span></p>
            <ul class="ticket-items">
                <li><span>1x</span><a href="https://suhanitiwari.com" target="_blank" rel="noopener">Portfolio</a><em>free</em></li>
                <li><span>1x</span><a href="https://www.linkedin.com/in/suhxnitiwari/" target="_blank" rel="noopener">LinkedIn</a><em>free</em></li>
                <li><span>1x</span><a href="https://github.com/suhxnitiwari/Bevo_Taco-Checkout" target="_blank" rel="noopener">The recipe (code)</a><em>free</em></li>
                <li><span>1x</span><a href="mailto:suhxnitiwari@gmail.com">Extra hello</a><em>free</em></li>
            </ul>
            <p class="ticket-total"><span>Total</span><b>$0.00</b></p>
            <p class="ticket-thanks">Gracias, come again</p>
            <p class="ticket-legal">&copy; 2026 Suhani Tiwari. All rights reserved.</p>
        </div>
    </footer>

    <script type="module" src="js/app.js"></script>
</body>
</html>
