name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Tiwari_Suhani_HW2.sln

      - name: Build
        run: dotnet build Tiwari_Suhani_HW2.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Tiwari_Suhani_HW2.sln --no-build --configuration Release --verbosity normal
